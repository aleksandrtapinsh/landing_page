<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <title>Live &middot; Sasha Tapinsh Online</title>
</head>

<body>
  <header>
    <h1><span>sasha</span>-tapinsh.online<span class="live-slash">/live</span></h1>
  </header>

  <main class="live">
    <div class="live-row">
      <div class="live-frame">
        <video id="player" class="live-video" controls playsinline muted autoplay></video>
        <span id="badge" class="live-badge" hidden>LIVE<span id="viewers" class="live-viewers"></span></span>
        <button id="theater" class="theater-btn" type="button" title="Theater mode (t)" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <rect x="7" y="9" width="10" height="6" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <div id="offline" class="live-offline">
          <span class="live-dot"></span>
          <p>Offline</p>
          <small>Nothing is streaming right now.</small>
        </div>
      </div>

      <aside class="chat">
        <div class="chat-head">
          <span>Chat</span>
          <div class="chat-head-actions">
            <button id="mod-open" class="account-btn" type="button" hidden>Mod</button>
            <div id="account" class="account"></div>
          </div>
        </div>
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" maxlength="500" autocomplete="off" placeholder="Say something…">
          <button type="submit">Send</button>
        </form>
        <p id="chat-notice" class="chat-notice"></p>
      </aside>
    </div>

    <a class="live-back" href="/">&larr; back</a>
  </main>

  <dialog id="account-dialog" class="account-dialog">
    <form id="account-form">
      <h2 id="account-title">Sign in</h2>
      <label id="account-email-row" hidden>
        <span>Email</span>
        <input name="email" type="email" autocomplete="email">
      </label>
      <label>
        <span>Username</span>
        <input name="identifier" type="text" required autocomplete="username">
      </label>
      <label>
        <span>Password</span>
        <input name="password" type="password" required minlength="8" autocomplete="current-password">
      </label>
      <p id="account-error" class="account-error"></p>
      <div class="account-actions">
        <button id="account-toggle" type="button" class="account-link">Need an account?</button>
        <div>
          <button type="button" class="account-btn" onclick="this.closest('dialog').close()">Cancel</button>
          <button id="account-submit" type="submit" class="account-btn account-btn--primary">Sign in</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="color-dialog" class="account-dialog">
    <form id="color-form">
      <h2>Name color</h2>
      <div id="color-swatches" class="color-swatches"></div>
      <label>
        <span>Hex code</span>
        <input id="color-hex" name="hex" type="text" maxlength="7" spellcheck="false" placeholder="#2570c7">
      </label>
      <p id="color-preview" class="color-preview"></p>
      <p id="color-error" class="account-error"></p>
      <div class="account-actions">
        <span></span>
        <div>
          <button type="button" class="account-btn" onclick="this.closest('dialog').close()">Cancel</button>
          <button type="submit" class="account-btn account-btn--primary">Save</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="mod-dialog" class="account-dialog mod-dialog">
    <h2>Chat users</h2>
    <p id="mod-anon" class="mod-anon"></p>
    <div id="mod-list" class="mod-list"></div>
    <p id="mod-error" class="account-error"></p>
    <div class="account-actions">
      <span></span>
      <button type="button" class="account-btn" onclick="this.closest('dialog').close()">Close</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="live.js"></script>
  <script src="account.js"></script>
  <script src="chat.js"></script>
</body>

</html>
