<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sasha-tapinsh.online</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    header {
      margin-bottom: 3rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #a0a0a0;
    }

    header h1 span {
      color: #e8e8e8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      width: min(600px, 90vw);
    }

    a.card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.8rem 1rem;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      background: #161616;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }

    a.card:hover {
      border-color: #555;
      background: #1e1e1e;
      transform: translateY(-2px);
    }

    a.card svg {
      width: 32px;
      height: 32px;
      opacity: 0.75;
    }

    a.card span {
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #3a3a3a;
    }
  </style>
</head>

<body>
  <header>
    <h1><span>sasha</span>-tapinsh.online</h1>
  </header>

  <main class="grid">
    <a class="card" href="https://showdown.sasha-tapinsh.online" target="_blank" rel="noopener">
      <!-- lightning bolt -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round">
        <img src="Pokemon_showdown_icon.png" alt="Showdown Logo" </svg>
        <span>Showdown</span>
    </a>

    <a class="card" href="https://immich.sasha-tapinsh.online" target="_blank" rel="noopener">
      <!-- photo / image -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <polyline points="21 15 16 10 5 21" />
      </svg>
      <span>Immich</span>
    </a>

    <a class="card" href="https://jellyfin.sasha-tapinsh.online" target="_blank" rel="noopener">
      <!-- play / media -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <polygon points="10 8 16 12 10 16 10 8" />
      </svg>
      <span>Jellyfin</span>
    </a>
  </main>

  <footer>sasha-tapinsh.online</footer>
</body>

</html>
