<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" type="image/x-icon">
  <title>Sasha Tapinsh Online</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    header {
      margin-bottom: 3rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #a0a0a0;
    }

    header h1 span {
      color: #e8e8e8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      width: min(600px, 90vw);
      align-items: center;
    }

    a.card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.8rem 1rem;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      background: #161616;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }

    a.card:hover {
      border-color: #555;
      background: #1e1e1e;
      transform: translateY(-2px);
    }

    a.card svg,
    a.card img {
      width: 32px;
      height: 32px;
      opacity: 0.75;
    }

    a.card span {
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    footer {
      margin-top: 1.5em;
      font-size: 0.75rem;
      color: #3a3a3a;
    }
  </style>
</head>

<body>
  <header>
    <h1><span>sasha</span>-tapinsh.online</h1>
  </header>

  <main class="grid">
    <a class="card" href="https://showdown.sasha-tapinsh.online" target="_blank" rel="noopener">
      <!-- showdown logo -->
      <img src="Pokemon_showdown_icon.png" alt="Showdown Logo" />
      <span>Showdown</span>
    </a>

    <a class="card" href="https://immich.sasha-tapinsh.online" target="_blank" rel="noopener">
      <!-- photo / image -->
      <img src="immich.svg" target="_blank" rel="noopener">
      <span>Immich</span>
    </a>

    <a class="card" href="https://jellyfin.sasha-tapinsh.online" target="_blank" rel="noopener">
      <!-- play / media -->
      <img src="jellyfin-icon.svg" target="_blank" rel="noopener">
      <span>Jellyfin</span>
    </a>

    <a class="card" href="https://collab.sasha-tapinsh.online" target="_blank" rel="noopener">
      <img src="collabcode.png" target="_blank" rel="noopener">
      <span>CollabCode</span>
    </a>
  </main>
  <p style="margin-top: 3rem;
      font-size: 0.75rem;
      color: #3a3a3a;">Connect with me!</p>
  <footer style="display: flex; gap: 12px; align-items: center;">
    <a href="https://github.com/aleksandrtapinsh" target="_blank" rel="noopener">
      <img src="https://github.com/favicon.ico" target="_blank" rel="noopener" width="32" height="32">
    </a>
    <a href="https://steamcommunity.com/id/diemoirai/" target="_blank" rel="noopener">
      <img src="https://store.steampowered.com/favicon.ico" target="_blank" rel="noopener" width="32" height="32">
    </a>
    <a href="https://open.spotify.com/user/aleksandr2003?si=8e7bdc636f87422e" target="_blank" rel="noopener">
      <img src="https://open.spotify.com/favicon.ico" target="_blank" rel="noopener" width="32" height="32">
    </a>
    <a href="https://www.youtube.com/@hoodwolf" target="_blank" rel="noopener">
      <img src="https://www.youtube.com/favicon.ico" target="_blank" rel="noopener" width="32" height="32">
    </a>
  </footer>
</body>

</html>
