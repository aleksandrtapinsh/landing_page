<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <title>Sasha Tapinsh Online</title>
</head>

<body>
  <section class="live">
    <div class="live-main">
      <div class="live-frame">
        <video id="player" class="live-video" controls playsinline muted autoplay></video>
        <span id="badge" class="live-badge" hidden>LIVE<span id="viewers" class="live-viewers"></span></span>
        <div id="offline" class="live-offline">
          <span class="live-dot"></span>
          <p>Offline</p>
        </div>
      </div>
    </div>

    <aside class="chat">
      <div class="chat-head">
        <span>Chat</span>
        <div id="account" class="account"></div>
      </div>
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" maxlength="500" autocomplete="off" placeholder="Say something…">
        <button type="submit">Send</button>
      </form>
      <p id="chat-notice" class="chat-notice"></p>
    </aside>
  </section>

  <dialog id="account-dialog" class="account-dialog">
    <form id="account-form">
      <h2 id="account-title">Sign in</h2>
      <label id="account-email-row" hidden>
        <span>Email</span>
        <input name="email" type="email" autocomplete="email">
      </label>
      <label>
        <span>Username</span>
        <input name="identifier" type="text" required autocomplete="username">
      </label>
      <label>
        <span>Password</span>
        <input name="password" type="password" required minlength="8" autocomplete="current-password">
      </label>
      <p id="account-error" class="account-error"></p>
      <div class="account-actions">
        <button id="account-toggle" type="button" class="account-link">Need an account?</button>
        <div>
          <button type="button" class="account-btn" onclick="this.closest('dialog').close()">Cancel</button>
          <button id="account-submit" type="submit" class="account-btn account-btn--primary">Sign in</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="color-dialog" class="account-dialog">
    <form id="color-form">
      <h2>Name color</h2>
      <div id="color-swatches" class="color-swatches"></div>
      <label>
        <span>Hex code</span>
        <input id="color-hex" name="hex" type="text" maxlength="7" spellcheck="false" placeholder="#8ab4f8">
      </label>
      <p id="color-preview" class="color-preview"></p>
      <p id="color-error" class="account-error"></p>
      <div class="account-actions">
        <span></span>
        <div>
          <button type="button" class="account-btn" onclick="this.closest('dialog').close()">Cancel</button>
          <button type="submit" class="account-btn account-btn--primary">Save</button>
        </div>
      </div>
    </form>
  </dialog>

  <header>
    <h1><span>sasha</span>-tapinsh.online</h1>
    <form class="search-bar" action="https://search.brave.com/search" name="q">
      <input type="text" name="q" pattern=".*\S.*" required>
      <button class="search-btn" type="submit">
        <span>Search</span>
      </button>
    </form>
  </header>
  <main class="grid">
